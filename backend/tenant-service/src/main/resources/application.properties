# Ten ung dung
spring.application.name=tenant-service

# Cong chay Tenant Service
server.port=8082

# Ket noi SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:49675;databaseName=tenant_service_db;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true