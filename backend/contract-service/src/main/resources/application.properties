# Ten ung dung
spring.application.name=contract-service

# Cong chay cua Contract Service
server.port=8083

# Cau hinh ket noi MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/contract_service_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Cau hinh Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dia chi cac Microservices
services.room.url=http://localhost:8081
services.tenant.url=http://localhost:8082