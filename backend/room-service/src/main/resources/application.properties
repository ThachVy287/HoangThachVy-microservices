# Ten ung dung
spring.application.name=room-service

# Cong chay cua Room Service
server.port=8081

# Cau hinh ket noi MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/room_service_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Cau hinh Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true